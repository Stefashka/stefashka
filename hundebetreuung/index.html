<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hundebetreuung — Abrechnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #171514;
    --muted: #83807c;
    --border: #e4e0dc;
    --bg: #fff;
    --accent: #537393;
    --hover: #f7f5f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 100px;
    line-height: 1.5;
  }
  .brand {
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-align: center;
    color: var(--accent);
    margin-bottom: 48px;
    line-height: 1.05;
  }
  .input-row {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  input[type="date"] {
    flex: 1;
    min-width: 160px;
    padding: 10px 2px;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: transparent;
  }
  input[type="date"]:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  button {
    padding: 11px 22px;
    border: 1px solid var(--text);
    background: var(--text);
    color: #fff;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }
  button.ghost {
    background: none;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--bg);
    padding: 22px 20px;
  }
  .stat .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .stat .value {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .rate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 48px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--border);
  }
  .rate-row label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--muted);
  }
  .rate-row .rate-field {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="number"] {
    width: 70px;
    padding: 6px 2px;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    text-align: right;
    background: transparent;
  }
  input[type="number"]:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 12px;
  }
  ul.entries { list-style: none; }
  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .entry .date {
    font-size: 0.95rem;
    font-weight: 600;
  }
  .entry .actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.billed {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .toggle-link, .delete-link {
    font-size: 0.78rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
  }
  .toggle-link:hover, .delete-link:hover { color: var(--accent); }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px 4px;
  }
  section { margin-bottom: 40px; }
</style>
</head>
<body>

<h1>Abrechnung</h1>

<div class="input-row">
  <input type="date" id="dateInput">
  <button id="addBtn">Tag hinzufügen</button>
</div>

<div class="rate-row">
  <label for="rateInput">Tagessatz</label>
  <div class="rate-field">
    <input type="number" id="rateInput" min="0" step="1" value="10">
    <span>€</span>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="label">Offene Tage</div>
    <div class="value" id="openCount">0</div>
  </div>
  <div class="stat">
    <div class="label">Offener Betrag</div>
    <div class="value" id="openAmount">0 €</div>
  </div>
</div>

<section>
  <h2>Offen</h2>
  <ul class="entries" id="openList"></ul>
</section>

<section>
  <h2>Berechnet</h2>
  <ul class="entries" id="billedList"></ul>
</section>

<script>
  const STORAGE_KEY = 'hundebetreuung_entries';
  const RATE_KEY = 'hundebetreuung_rate';

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }
  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }
  function loadRate() {
    const r = parseFloat(localStorage.getItem(RATE_KEY));
    return isNaN(r) ? 10 : r;
  }
  function saveRate(r) {
    localStorage.setItem(RATE_KEY, String(r));
  }

  let entries = loadEntries();
  let rate = loadRate();

  const dateInput = document.getElementById('dateInput');
  const addBtn = document.getElementById('addBtn');
  const rateInput = document.getElementById('rateInput');
  const openCountEl = document.getElementById('openCount');
  const openAmountEl = document.getElementById('openAmount');
  const openListEl = document.getElementById('openList');
  const billedListEl = document.getElementById('billedList');

  rateInput.value = rate;

  function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}.${m}.${y}`;
  }

  function render() {
    entries.sort((a, b) => b.date.localeCompare(a.date));

    const open = entries.filter(e => !e.billed);
    const billed = entries.filter(e => e.billed);

    openCountEl.textContent = open.length;
    openAmountEl.textContent = (open.length * rate).toLocaleString('de-DE') + ' €';

    openListEl.innerHTML = open.length ? '' : '<li class="empty">Keine offenen Tage.</li>';
    open.forEach(e => openListEl.appendChild(renderEntry(e)));

    billedListEl.innerHTML = billed.length ? '' : '<li class="empty">Noch keine Tage berechnet.</li>';
    billed.forEach(e => billedListEl.appendChild(renderEntry(e)));
  }

  function renderEntry(e) {
    const li = document.createElement('li');
    li.className = 'entry';

    const dateSpan = document.createElement('span');
    dateSpan.className = 'date';
    dateSpan.textContent = formatDate(e.date);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const badge = document.createElement('span');
    badge.className = 'badge' + (e.billed ? ' billed' : '');
    badge.textContent = e.billed ? 'berechnet' : 'offen';

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'toggle-link';
    toggleBtn.textContent = e.billed ? 'als offen markieren' : 'als berechnet markieren';
    toggleBtn.onclick = () => {
      e.billed = !e.billed;
      saveEntries(entries);
      render();
    };

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-link';
    deleteBtn.textContent = 'löschen';
    deleteBtn.onclick = () => {
      entries = entries.filter(x => x.id !== e.id);
      saveEntries(entries);
      render();
    };

    actions.appendChild(badge);
    actions.appendChild(toggleBtn);
    actions.appendChild(deleteBtn);

    li.appendChild(dateSpan);
    li.appendChild(actions);
    return li;
  }

  addBtn.addEventListener('click', () => {
    const val = dateInput.value;
    if (!val) return;
    if (entries.some(e => e.date === val)) {
      alert('Für diesen Tag existiert bereits ein Eintrag.');
      return;
    }
    entries.push({ id: Date.now(), date: val, billed: false });
    saveEntries(entries);
    dateInput.value = '';
    render();
  });

  rateInput.addEventListener('input', () => {
    const val = parseFloat(rateInput.value);
    rate = isNaN(val) ? 0 : val;
    saveRate(rate);
    render();
  });

  render();
</script>

</body>
</html>
